name: One-time medical frontend optimization

on:
  push:
    branches:
      - medical-frontend-optimize-20260815
    paths:
      - .github/workflows/one-time-medical-frontend-optimize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch medical exam frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def unique_pos(haystack, needle, label, start=0):
              pos = haystack.find(needle, start)
              if pos < 0:
                  raise SystemExit(f"{label}: marker not found")
              if haystack.find(needle, pos + 1) >= 0:
                  raise SystemExit(f"{label}: marker is not unique")
              return pos

          def replace_n(old, new, expected, label):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected}, found {count}")
              text = text.replace(old, new)

          def splice_global(start_marker, end_marker, replacement, label):
              global text
              start = unique_pos(text, start_marker, label + " start")
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f"{label}: end marker not found")
              text = text[:start] + replacement + text[end:]

          def function_segment(start_marker, end_marker, label):
              start = unique_pos(text, start_marker, label + " function start")
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f"{label}: function end marker not found")
              return start, end, text[start:end]

          # Login and active-session startup: use cache unless explicitly forced elsewhere.
          replace_n(
              'trainerScheduleMedicalExamAlertsCheck_(300, true);',
              'trainerScheduleMedicalExamAlertsCheck_(300);',
              2,
              'startup alert checks',
          )

          # Normalize the medical date returned by listaZawodnikow.
          new_player_cache = '''    window.__trainerPlayersListCache = lista.map(z => {
            const legacyMedicalExam =
              z.medicalExam && typeof z.medicalExam === "object"
                ? z.medicalExam
                : null;

            const hasFlatMedicalDate =
              Object.prototype.hasOwnProperty.call(z, "medicalExamValidUntil") ||
              Object.prototype.hasOwnProperty.call(z, "medical_exam_valid_until");

            const flatMedicalDate = String(
              z.medicalExamValidUntil ??
              z.medical_exam_valid_until ??
              ""
            ).trim();

            const legacyMedicalDate = String(
              legacyMedicalExam?.validUntil ||
              legacyMedicalExam?.validUntilLabel ||
              legacyMedicalExam?.date ||
              ""
            ).trim();

            return {
              nr: String(z.nr || "").trim(),
              nazwisko: String(z.nazwisko || "").trim(),
              numerWidoczny: String(
                z.numerWidoczny ||
                z.visibleNumber ||
                z.numerKoszulki ||
                ""
              ).trim(),
              medicalExamLoaded: hasFlatMedicalDate || !!legacyMedicalExam,
              medicalExamValidUntil: hasFlatMedicalDate
                ? flatMedicalDate
                : legacyMedicalDate
            };
          });

          trainerRebuildMedicalAlertsFromPlayerCache_();'''

          splice_global(
              '    window.__trainerPlayersListCache = lista.map(z => ({',
              '\n\n    box.innerHTML = lista.map((z, idx) => {',
              new_player_cache,
              'player list medical cache',
          )

          new_tile_alert = '''      const medicalAlert =
            (window.__trainerMedicalExamAlertsByNr || {})[nr] || null;
          const hasMedicalAlert = !!medicalAlert;
          const daysLeft = Number(medicalAlert && medicalAlert.daysLeft);
          const medicalText =
            hasMedicalAlert && Number.isFinite(daysLeft) && daysLeft < 0
              ? "BADANIA PO TERMINIE"
              : hasMedicalAlert && Number.isFinite(daysLeft) && daysLeft === 0
                ? "BADANIA DO DZISIAJ"
                : hasMedicalAlert
                  ? "WAŻNOŚĆ BADAŃ"
                  : "";'''

          splice_global(
              '      const med = z.medicalExam || {};',
              '\n\n      const medicalWarningHtml = hasMedicalAlert',
              new_tile_alert,
              'player tile medical alert',
          )

          line = '  trainerScheduleMedicalExamAlertsCheck_(0);\n\n'
          if text.count(line) != 1:
              raise SystemExit(f"list-view extra request: expected 1, found {text.count(line)}")
          text = text.replace(line, '', 1)

          # Selected player detail: prefer the date already loaded with the player list.
          fn_start, fn_end, seg = function_segment(
              'async function trainerLoadMedicalExamForSelectedPlayer_() {',
              '\n}\n\n/**\n * Otwiera popup edycji daty badań.',
              'selected player medical loader',
          )

          selected_start = seg.find('  const medicalExam =')
          selected_end = seg.find('\n\n  /*\n   * Fallback tylko przy świadomym otwarciu zawodnika,', selected_start)
          if selected_start < 0 or selected_end < 0:
              raise SystemExit('selected player cache block not found')

          new_selected = '''  if (cachedPlayer && cachedPlayer.medicalExamLoaded === true) {
            const validUntil = String(
              cachedPlayer.medicalExamValidUntil || ""
            ).trim();

            if (dateEl) {
              dateEl.textContent = validUntil || "Nie ustawiono";
            }

            return;
          }'''
          seg = seg[:selected_start] + new_selected + seg[selected_end:]

          fallback_start = seg.find('    const validUntil = String(res.validUntil || "").trim();')
          fallback_end = seg.find('\n\n  } catch (e) {', fallback_start)
          if fallback_start < 0 or fallback_end < 0:
              raise SystemExit('selected player fallback result block not found')

          new_fallback = '''    const validUntil = String(res.validUntil || "").trim();

            if (cachedPlayer) {
              cachedPlayer.medicalExamLoaded = true;
              cachedPlayer.medicalExamValidUntil = validUntil;
              trainerUpdateMedicalAlertForPlayer_(nr, validUntil);
            }

            if (dateEl) {
              dateEl.textContent = validUntil || "Nie ustawiono";
            }'''
          seg = seg[:fallback_start] + new_fallback + seg[fallback_end:]
          text = text[:fn_start] + seg + text[fn_end:]

          # Save: update the cached player, tile and beacon locally after the successful POST.
          fn_start, fn_end, seg = function_segment(
              'async function trainerSaveMedicalExam_() {',
              '\n}\n\n\n/* ------------- ALERT BADAŃ / KOGUT / OZNACZENIA KAFELKÓW ------------*/',
              'medical save',
          )
          success_anchor = seg.find('    if (!res || res.success !== true) {')
          save_start = seg.find('    if (dateEl) {', success_anchor)
          save_end = seg.find('\n\n    setTimeout(() => {', save_start)
          if success_anchor < 0 or save_start < 0 or save_end < 0:
              raise SystemExit('medical save success block not found')

          new_after_save = '''    if (dateEl) {
            dateEl.textContent = validUntil || "Nie ustawiono";
          }

          const cachedPlayer =
            Array.isArray(window.__trainerPlayersListCache)
              ? window.__trainerPlayersListCache.find(player => {
                  return String(player?.nr || "").trim() === nr;
                })
              : null;

          if (cachedPlayer) {
            cachedPlayer.medicalExamLoaded = true;
            cachedPlayer.medicalExamValidUntil = validUntil;
          }

          trainerUpdateMedicalAlertForPlayer_(nr, validUntil);

          if (msg) msg.textContent = "✅ Zapisano.";'''
          seg = seg[:save_start] + new_after_save + seg[save_end:]
          text = text[:fn_start] + seg + text[fn_end:]

          # Keep a tri-state feature flag: null until endpoint/cache establishes state.
          global_line = 'window.__trainerMedicalExamAlertsCount = window.__trainerMedicalExamAlertsCount || 0;\n'
          if text.count(global_line) != 1:
              raise SystemExit('medical global count line missing or duplicated')
          text = text.replace(
              global_line,
              global_line + '''window.__trainerMedicalExamAlertsEnabled =
            typeof window.__trainerMedicalExamAlertsEnabled === "boolean"
              ? window.__trainerMedicalExamAlertsEnabled
              : null;
''',
              1,
          )

          # Replace old always-fetch scheduler with local day math + 6h TTL cache.
          core_start_marker = '''/**
           * Buduje alerty badań z danych pobranych razem z listą zawodników.
           * Nie wykonuje osobnego zapytania do GAS.
           */'''
          core_end_marker = '''/**
           * Dorysowuje czerwony napis "WAŻNOŚĆ BADAŃ" na widocznych kaflach zawodników.'''
          start = unique_pos(text, core_start_marker, 'medical scheduler start')
          end = text.find(core_end_marker, start + len(core_start_marker))
          if end < 0:
              raise SystemExit('medical scheduler end marker not found')

          new_core = r'''const TRAINER_MEDICAL_ALERT_TTL_MS = 6 * 60 * 60 * 1000;
          const TRAINER_MEDICAL_ALERT_HORIZON_DAYS = 10;

          function trainerMedicalExamDaysLeft_(validUntil) {
            const value = String(validUntil || "").trim();
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
            if (!match) return null;

            const targetUtc = Date.UTC(
              Number(match[1]),
              Number(match[2]) - 1,
              Number(match[3])
            );

            const now = new Date();
            const todayUtc = Date.UTC(
              now.getFullYear(),
              now.getMonth(),
              now.getDate()
            );

            return Math.round((targetUtc - todayUtc) / 86400000);
          }

          function trainerMedicalAlertFromDate_(nr, validUntil) {
            const playerNr = String(nr || "").trim();
            const date = String(validUntil || "").trim();
            if (!playerNr || !date) return null;

            const daysLeft = trainerMedicalExamDaysLeft_(date);
            if (!Number.isFinite(daysLeft)) return null;
            if (daysLeft > TRAINER_MEDICAL_ALERT_HORIZON_DAYS) return null;

            return { numer: playerNr, validUntil: date, daysLeft };
          }

          function trainerSetMedicalAlertsState_(enabled, alerts) {
            const isEnabled = enabled === true;
            const safeAlerts =
              isEnabled && Array.isArray(alerts) ? alerts : [];

            window.__trainerMedicalExamAlertsEnabled = isEnabled;
            window.__trainerMedicalExamAlertsByNr =
              trainerBuildMedicalAlertsMap_(safeAlerts);
            window.__trainerMedicalExamAlertsCount = safeAlerts.length;

            trainerSetMedicalAlertBeacon_(safeAlerts.length);
            trainerApplyMedicalAlertsToVisiblePlayerTiles_();
          }

          function trainerMedicalAlertsCacheKey_() {
            let session = null;
            try {
              session = typeof loadAppSession_ === "function"
                ? loadAppSession_()
                : null;
            } catch (e) {
              session = null;
            }

            const clubKey = String(
              window.clubId ||
              (typeof clubId !== "undefined" ? clubId : "") ||
              localStorage.getItem("clubId") ||
              ""
            ).trim().toLowerCase();

            const loginKey = String(
              session?.loginId || session?.login || ""
            ).trim().toLowerCase();

            const groupsKey = String(
              window.grupyTrenera || session?.grupa || ""
            )
              .split(",")
              .map(value => value.trim())
              .filter(Boolean)
              .sort()
              .join(",");

            if (!clubKey || !loginKey) return "";

            return (
              "orghub.medical-alerts.v1." +
              encodeURIComponent(clubKey) + "." +
              encodeURIComponent(loginKey) + "." +
              encodeURIComponent(groupsKey || "no-groups")
            );
          }

          function trainerReadMedicalAlertsCache_() {
            const key = trainerMedicalAlertsCacheKey_();
            if (!key) return null;

            try {
              const raw = localStorage.getItem(key);
              if (!raw) return null;

              const entry = JSON.parse(raw);
              const savedAt = Number(entry?.savedAt || 0);
              if (!savedAt || Date.now() - savedAt > TRAINER_MEDICAL_ALERT_TTL_MS) {
                localStorage.removeItem(key);
                return null;
              }

              const enabled = entry?.enabled === true;
              const cachedAlerts = Array.isArray(entry?.alerts)
                ? entry.alerts
                : [];

              const alerts = enabled
                ? cachedAlerts
                    .map(alert => {
                      const nr = String(
                        alert?.numer || alert?.player_id || ""
                      ).trim();
                      const validUntil = String(
                        alert?.validUntil || alert?.valid_until || ""
                      ).trim();
                      return trainerMedicalAlertFromDate_(nr, validUntil);
                    })
                    .filter(Boolean)
                : [];

              return { savedAt, enabled, alerts };
            } catch (e) {
              return null;
            }
          }

          function trainerWriteMedicalAlertsCache_(enabled, alerts) {
            const key = trainerMedicalAlertsCacheKey_();
            if (!key) return;

            const savedAt = Date.now();
            try {
              localStorage.setItem(
                key,
                JSON.stringify({
                  savedAt,
                  enabled: enabled === true,
                  alerts: Array.isArray(alerts) ? alerts : []
                })
              );
              window.__trainerMedicalExamAlertLastCheckMs = savedAt;
            } catch (e) {}
          }

          function trainerRebuildMedicalAlertsFromPlayerCache_() {
            const players = Array.isArray(window.__trainerPlayersListCache)
              ? window.__trainerPlayersListCache
              : [];

            const stateKnown =
              typeof window.__trainerMedicalExamAlertsEnabled === "boolean";
            const enabled = stateKnown
              ? window.__trainerMedicalExamAlertsEnabled === true
              : trainerIsMedicalFeatureEnabledFromCache_();

            if (!enabled) {
              trainerSetMedicalAlertsState_(false, []);
              return;
            }

            const alerts = [];
            players.forEach(player => {
              if (!player || player.medicalExamLoaded !== true) return;
              const alert = trainerMedicalAlertFromDate_(
                player.nr,
                player.medicalExamValidUntil
              );
              if (alert) alerts.push(alert);
            });

            trainerSetMedicalAlertsState_(true, alerts);
            if (stateKnown) {
              trainerWriteMedicalAlertsCache_(true, alerts);
            }
          }

          function trainerUpdateMedicalAlertForPlayer_(nr, validUntil) {
            const playerNr = String(nr || "").trim();
            if (!playerNr) return;

            const stateKnown =
              typeof window.__trainerMedicalExamAlertsEnabled === "boolean";
            const enabled = stateKnown
              ? window.__trainerMedicalExamAlertsEnabled === true
              : trainerIsMedicalFeatureEnabledFromCache_();

            const map = { ...(window.__trainerMedicalExamAlertsByNr || {}) };
            delete map[playerNr];

            if (enabled) {
              const alert = trainerMedicalAlertFromDate_(playerNr, validUntil);
              if (alert) map[playerNr] = alert;
            }

            const alerts = Object.values(map);
            trainerSetMedicalAlertsState_(enabled, alerts);
            trainerWriteMedicalAlertsCache_(enabled, alerts);
          }

          function trainerScheduleMedicalExamAlertsCheck_(delayMs, forceRefresh) {
            const delay = Math.max(0, Number(delayMs) || 0);

            if (window.__trainerMedicalExamAlertsTimer) {
              clearTimeout(window.__trainerMedicalExamAlertsTimer);
            }

            window.__trainerMedicalExamAlertsTimer = setTimeout(() => {
              trainerRefreshMedicalExamAlerts_(forceRefresh === true).catch(error => {
                console.warn("trainerRefreshMedicalExamAlerts_ error:", error);
              });
            }, delay);

            return true;
          }

          async function trainerRefreshMedicalExamAlerts_(forceRefresh) {
            const now = Date.now();

            if (forceRefresh !== true) {
              const lastCheck = Number(
                window.__trainerMedicalExamAlertLastCheckMs || 0
              );

              if (lastCheck > 0 && now - lastCheck < TRAINER_MEDICAL_ALERT_TTL_MS) {
                trainerSetMedicalAlertsState_(
                  window.__trainerMedicalExamAlertsEnabled === true,
                  Object.values(window.__trainerMedicalExamAlertsByNr || {})
                );
                return { success: true, cached: true };
              }

              const cached = trainerReadMedicalAlertsCache_();
              if (cached) {
                window.__trainerMedicalExamAlertLastCheckMs = cached.savedAt;
                trainerSetMedicalAlertsState_(cached.enabled, cached.alerts);
                return {
                  success: true,
                  enabled: cached.enabled,
                  alerts: cached.alerts,
                  cached: true
                };
              }
            }

            const groups = String(window.grupyTrenera || "").trim();

            try {
              const res = await apiClubGet("trainerMedicalExamAlerts", {
                grupy: groups,
                t: Date.now()
              });

              if (!res || res.success !== true) {
                return res || {
                  success: false,
                  error: "Brak odpowiedzi trainerMedicalExamAlerts"
                };
              }

              const enabled =
                res.enabled === true ||
                res.enabled === 1 ||
                String(res.enabled || "").trim() === "1" ||
                String(res.enabled || "").trim().toUpperCase() === "TRUE";

              const alerts =
                enabled && Array.isArray(res.alerts) ? res.alerts : [];

              window.__trainerMedicalExamAlertLastCheckMs = Date.now();
              trainerSetMedicalAlertsState_(enabled, alerts);
              trainerWriteMedicalAlertsCache_(enabled, alerts);
              return res;
            } catch (error) {
              console.warn("trainerMedicalExamAlerts request error:", error);
              return {
                success: false,
                error: String(error?.message || error)
              };
            }
          }

          '''

          text = text[:start] + new_core + text[end:]

          # Safety assertions.
          for old_call in (
              'trainerScheduleMedicalExamAlertsCheck_(200, true)',
              'trainerScheduleMedicalExamAlertsCheck_(300, true)',
              'trainerScheduleMedicalExamAlertsCheck_(0)',
          ):
              if old_call in text:
                  raise SystemExit(f'old hot-path call still present: {old_call}')

          for needle in (
              'medicalExamValidUntil',
              'TRAINER_MEDICAL_ALERT_TTL_MS',
              'trainerReadMedicalAlertsCache_',
              'trainerUpdateMedicalAlertForPlayer_',
          ):
              if needle not in text:
                  raise SystemExit(f'missing expected code: {needle}')

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only)" = "index.html"
          grep -n "TRAINER_MEDICAL_ALERT_TTL_MS" index.html
          grep -n "medicalExamValidUntil" index.html | head

      - name: Commit optimized frontend and remove helper workflow
        shell: bash
        run: |
          git config user.name "Orghub-systems"
          git config user.email "orghubsystems@gmail.com"
          git rm .github/workflows/one-time-medical-frontend-optimize.yml
          git add index.html
          git commit -m "Optimize medical exam alerts frontend"
          git push origin HEAD:medical-frontend-optimize-20260815
