name: One-time medical frontend optimization

on:
  push:
    branches:
      - medical-frontend-optimize-20260815
    paths:
      - .github/workflows/one-time-medical-frontend-optimize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch medical exam frontend
        run: python tools/medical_frontend_patch.py

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only)" = "index.html"
          grep -n "TRAINER_MEDICAL_ALERT_TTL_MS" index.html
          grep -n "medicalExamValidUntil" index.html | head
          if grep -q "trainerScheduleMedicalExamAlertsCheck_(200, true)" index.html; then
            echo "Unexpected forced refresh after save"
            exit 1
          fi

      - name: Commit optimized frontend and remove temporary helpers
        shell: bash
        run: |
          git config user.name "Orghub-systems"
          git config user.email "orghubsystems@gmail.com"
          git rm .github/workflows/one-time-medical-frontend-optimize.yml
          git rm tools/medical_frontend_patch.py
          git add index.html
          git commit -m "Optimize medical exam alerts frontend"
          git push origin HEAD:medical-frontend-optimize-20260815
