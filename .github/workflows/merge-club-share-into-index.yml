name: Merge club share into index

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-club-share:
    if: github.event.pull_request.title == 'ORG HUB: merge club share into index'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge club-share.js into index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('index.html')
          medical_path = Path('medical-no-polling.js')
          club_path = Path('club-share.js')
          sw_path = Path('service-worker.js')

          index = index_path.read_text(encoding='utf-8')
          medical = medical_path.read_text(encoding='utf-8')
          club = club_path.read_text(encoding='utf-8')
          sw = sw_path.read_text(encoding='utf-8')

          css_start = '/* ===== ADMIN — UDOSTĘPNIANIE KLUBU: CSS START ===== */'
          css_end = '/* ===== ADMIN — UDOSTĘPNIANIE KLUBU: CSS KONIEC ===== */'
          js_start = '/* =================== ADMIN — UDOSTĘPNIANIE KLUBU START =================== */'
          js_end = '/* =================== ADMIN — UDOSTĘPNIANIE KLUBU KONIEC =================== */'

          # Operacja jest idempotentna.
          index = re.sub(
              re.escape(css_start) + r'.*?' + re.escape(css_end) + r'\s*',
              '',
              index,
              flags=re.S,
          )
          index = re.sub(
              re.escape(js_start) + r'.*?' + re.escape(js_end) + r'\s*',
              '',
              index,
              flags=re.S,
          )

          style_match = re.search(
              r'  function ensureStyles_\(\) \{.*?style\.textContent = `([\s\S]*?)`;\s*document\.head\.appendChild\(style\);\s*\}',
              club,
          )
          if not style_match:
              raise RuntimeError('Nie znaleziono stylów club-share.js')

          club_css = style_match.group(1).strip()

          # Usuń dynamiczne wstrzykiwanie CSS z kodu przenoszonego do index.html.
          club_inline = club[:style_match.start()] + club[style_match.end():]
          club_inline = club_inline.replace('    ensureStyles_();\n', '', 1)

          # Po scaleniu sekcja ma powstawać dopiero przy wejściu do widoku administratora.
          club_inline = club_inline.replace(
              '  hookAdminSettingsOpen_();\n  renderSection_();\n})();',
              '  hookAdminSettingsOpen_();\n})();',
              1,
          )

          if 'renderSection_();\n})();' in club_inline:
              raise RuntimeError('Nie udało się usunąć startowego renderSection_()')

          loader_marker = '/* ADMIN: link klubu, kod QR i systemowe udostępnianie */'
          hotfix_marker = '/* ADMIN HOTFIX: prawidłowa biblioteka QR + adapter do API QRCode.toCanvas */'

          loader_pos = medical.find(loader_marker)
          hotfix_pos = medical.find(hotfix_marker)

          if loader_pos < 0 or hotfix_pos < 0 or hotfix_pos <= loader_pos:
              raise RuntimeError('Nie znaleziono loadera lub hotfixu QR w medical-no-polling.js')

          medical_core = medical[:loader_pos].rstrip() + '\n'
          qr_hotfix = medical[hotfix_pos:].strip()

          # CSS do istniejącego głównego sektora stylów.
          style_close = index.find('</style>')
          if style_close < 0:
              raise RuntimeError('Brak </style> w index.html')

          css_block = (
              '\n\n    ' + css_start + '\n'
              + club_css + '\n'
              + '    ' + css_end + '\n'
          )
          index = index[:style_close] + css_block + index[style_close:]

          # JS trafia do sektora administratora: po definicji funkcji otwierającej
          # ustawienia klubu, przed najbliższym znacznikiem końca sektora.
          function_candidates = [
              'function adminOpenClubSeasonSettingsView',
              'window.adminOpenClubSeasonSettingsView',
          ]
          function_pos = -1
          for candidate in function_candidates:
              function_pos = index.find(candidate)
              if function_pos >= 0:
                  break

          if function_pos < 0:
              raise RuntimeError('Brak adminOpenClubSeasonSettingsView w index.html')

          sector_end = index.find('/* =================== KONIEC SEKTORA', function_pos)
          if sector_end < 0:
              sector_end = index.find('</script>', function_pos)
          if sector_end < 0:
              raise RuntimeError('Nie znaleziono końca sektora administratora')

          js_block = (
              '\n\n' + js_start + '\n'
              + club_inline.strip() + '\n\n'
              + qr_hotfix + '\n'
              + js_end + '\n\n'
          )
          index = index[:sector_end] + js_block + index[sector_end:]

          # Wymuszenie odświeżenia aplikacji i skryptu medycznego.
          if "window.APP_BUILD = 'APP v3.05';" in index:
              index = index.replace(
                  "window.APP_BUILD = 'APP v3.05';",
                  "window.APP_BUILD = 'APP v3.06';",
                  1,
              )
          elif "window.APP_BUILD = 'APP v3.06';" not in index:
              raise RuntimeError('Nie rozpoznano APP_BUILD')

          if 'const MEDICAL_PATCH_VERSION = "2";' in sw:
              sw = sw.replace(
                  'const MEDICAL_PATCH_VERSION = "2";',
                  'const MEDICAL_PATCH_VERSION = "3";',
                  1,
              )
          elif 'const MEDICAL_PATCH_VERSION = "3";' not in sw:
              raise RuntimeError('Nie rozpoznano MEDICAL_PATCH_VERSION')

          index_path.write_text(index, encoding='utf-8')
          medical_path.write_text(medical_core, encoding='utf-8')
          sw_path.write_text(sw, encoding='utf-8')
          club_path.unlink()

          # Jednorazowy workflow usuwa sam siebie przed commitem.
          workflow_path = Path('.github/workflows/merge-club-share-into-index.yml')
          if workflow_path.exists():
              workflow_path.unlink()

      - name: Validate merged frontend
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          index = Path('index.html').read_text(encoding='utf-8')
          medical = Path('medical-no-polling.js').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')

          assert not Path('club-share.js').exists()
          assert 'club-share.js' not in medical
          assert 'installAdminClubShareLoader_' not in medical
          assert 'ADMIN HOTFIX: prawidłowa biblioteka QR' not in medical
          assert index.count('ADMIN — UDOSTĘPNIANIE KLUBU START') == 1
          assert index.count('ADMIN — UDOSTĘPNIANIE KLUBU: CSS START') == 1
          assert "window.APP_BUILD = 'APP v3.06';" in index
          assert 'const MEDICAL_PATCH_VERSION = "3";' in sw

          scripts = re.findall(
              r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',
              index,
              flags=re.I,
          )

          for number, script in enumerate(scripts, start=1):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile(
                  'w', suffix='.js', encoding='utf-8', delete=False
              ) as handle:
                  handle.write(script)
                  filename = handle.name
              subprocess.run(['node', '--check', filename], check=True)

          subprocess.run(['node', '--check', 'medical-no-polling.js'], check=True)
          subprocess.run(['node', '--check', 'service-worker.js'], check=True)
          print('Walidacja scalonego frontu zakończona poprawnie.')
          PY

      - name: Commit merged structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORG HUB frontend cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Merge club share into admin sector [skip ci]"
          git push origin main

      - name: Delete temporary PR branch
        if: always()
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git push origin --delete "$HEAD_REF" || true
