name: Apply player list refresh patch on branch

on:
  push:
    branches:
      - agent/fix-player-list-refresh
    paths:
      - .github/workflows/apply-player-list-refresh-branch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-player-list-refresh
          fetch-depth: 0

      - name: Patch player list caching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              ("window.APP_BUILD = 'APP v2.99';", "window.APP_BUILD = 'APP v3.00';", 1),
              ("const PLAYERS_CACHE_24H = 24 * 60 * 60 * 1000;", "const PLAYERS_CACHE_MAX_AGE_MS = 0;", 2),
          ]

          for old, new, expected in replacements:
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"Unexpected occurrence count for {old!r}: {found}, expected {expected}")
              text = text.replace(old, new)

          old_config = "maxAgeMs: PLAYERS_CACHE_24H,\n      useStale: true,\n      onCached:"
          new_config = "maxAgeMs: PLAYERS_CACHE_MAX_AGE_MS,\n      useStale: true,\n      backgroundRefresh: true,\n      onCached:"

          found = text.count(old_config)
          if found != 2:
              raise SystemExit(f"Unexpected player list config count: {found}, expected 2")

          text = text.replace(old_config, new_config)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          assert "window.APP_BUILD = 'APP v3.00';" in text
          assert text.count("const PLAYERS_CACHE_MAX_AGE_MS = 0;") == 2
          assert "PLAYERS_CACHE_24H" not in text

          blocks = [
              text[text.index("async function adminPokazZawodnikow()"):text.index("function isTrainerPlayerNumberPopupOpen_")],
              text[text.index("async function trainerPokazZawodnicy()"):text.index("function setTrainerZawodnikViewBusy_")],
          ]

          for block in blocks:
              assert "maxAgeMs: PLAYERS_CACHE_MAX_AGE_MS" in block
              assert "useStale: true" in block
              assert "backgroundRefresh: true" in block
              assert "_ts: Date.now()" in block
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix stale player lists after registration"
          git push origin HEAD:agent/fix-player-list-refresh
