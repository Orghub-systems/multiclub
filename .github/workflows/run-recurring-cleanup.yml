name: Run recurring events cleanup

on:
  push:
    paths:
      - ".github/workflows/run-recurring-cleanup.yml"

permissions:
  contents: write

jobs:
  run-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute prepared cleanup script
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow_path = Path(".github/workflows/cleanup-recurring-events.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          start_marker = "          from pathlib import Path\n"
          end_marker = "\n      - name: Validate JavaScript\n"

          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)

          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, str(workflow_path), "exec"), {})

          trigger = Path(".github/workflows/run-recurring-cleanup.yml")
          if trigger.exists():
              trigger.unlink()

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)

          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
                  handle.write(script)
                  temp_path = handle.name
              subprocess.run(['node', '--check', temp_path], check=True)

          subprocess.run(['node', '--check', 'medical-no-polling.js'], check=True)
          print('JavaScript validation OK')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "ORG HUB cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Merge recurring events into index and clean modules [skip ci]"
          git push origin main
