name: Apply player list refresh fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-player-list-refresh-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-player-list-refresh
          fetch-depth: 0

      - name: Patch player list caching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          build_old = "window.APP_BUILD = 'APP v2.99';"
          build_new = "window.APP_BUILD = 'APP v3.00';"
          if text.count(build_old) != 1:
              raise SystemExit(f"Expected one old build marker, found {text.count(build_old)}")
          text = text.replace(build_old, build_new, 1)

          const_old = "const PLAYERS_CACHE_24H = 24 * 60 * 60 * 1000;"
          const_new = "const PLAYERS_CACHE_MAX_AGE_MS = 0;"
          if text.count(const_old) != 2:
              raise SystemExit(f"Expected two player cache constants, found {text.count(const_old)}")
          text = text.replace(const_old, const_new)

          config_old = """      maxAgeMs: PLAYERS_CACHE_24H,
              useStale: true,
              onCached:"""
          config_new = """      maxAgeMs: PLAYERS_CACHE_MAX_AGE_MS,
              useStale: true,
              backgroundRefresh: true,
              onCached:"""
          if text.count(config_old) != 2:
              raise SystemExit(f"Expected two player cache configs, found {text.count(config_old)}")
          text = text.replace(config_old, config_new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")

          assert "window.APP_BUILD = 'APP v3.00';" in text
          assert text.count("const PLAYERS_CACHE_MAX_AGE_MS = 0;") == 2
          assert "PLAYERS_CACHE_24H" not in text

          admin_start = text.index("async function adminPokazZawodnikow()")
          admin_end = text.index("function isTrainerPlayerNumberPopupOpen_", admin_start)
          admin_block = text[admin_start:admin_end]

          trainer_start = text.index("async function trainerPokazZawodnicy()")
          trainer_end = text.index("function setTrainerZawodnikViewBusy_", trainer_start)
          trainer_block = text[trainer_start:trainer_end]

          for name, block in (("admin", admin_block), ("trainer", trainer_block)):
              assert "maxAgeMs: PLAYERS_CACHE_MAX_AGE_MS" in block, name
              assert "useStale: true" in block, name
              assert "backgroundRefresh: true" in block, name
              assert "_ts: Date.now()" in block, name
          PY

      - name: Commit fix to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix stale player lists after registration"
          git push origin HEAD:agent/fix-player-list-refresh
