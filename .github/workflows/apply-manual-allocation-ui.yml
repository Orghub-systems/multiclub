name: Apply manual allocation UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-przelewy-manual-allocation
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_build = "window.APP_BUILD = 'APP v2.98';"
          new_build = "window.APP_BUILD = 'APP v2.99';"

          if old_build in text:
              text = text.replace(old_build, new_build, 1)
          elif new_build not in text:
              raise SystemExit('Nie znaleziono APP_BUILD v2.98 ani v2.99')

          script_tag = '<script src="/manual-allocation-v3.js?v=20260712-1"></script>'
          if script_tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Nie znaleziono </body> w index.html')
              text = text.replace(marker, script_tag + '\n' + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check module syntax
        run: node --check manual-allocation-v3.js

      - name: Commit branch update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load manual transfer allocation module"
          git push origin HEAD:agent/system-przelewy-manual-allocation
