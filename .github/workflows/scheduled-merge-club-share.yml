name: Scheduled club share merge

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute prepared merge
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source_path = Path('.github/workflows/merge-club-share-into-index.yml')
          source = source_path.read_text(encoding='utf-8')

          start_marker = "          from pathlib import Path\n"
          end_marker = "\n      - name: Validate merged frontend\n"

          start = source.index(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, str(source_path), 'exec'), {})

          scheduled_path = Path('.github/workflows/scheduled-merge-club-share.yml')
          if scheduled_path.exists():
            scheduled_path.unlink()

      - name: Validate merged frontend
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          index = Path('index.html').read_text(encoding='utf-8')
          medical = Path('medical-no-polling.js').read_text(encoding='utf-8')
          sw = Path('service-worker.js').read_text(encoding='utf-8')

          assert not Path('club-share.js').exists()
          assert 'club-share.js' not in medical
          assert 'installAdminClubShareLoader_' not in medical
          assert 'ADMIN HOTFIX: prawidłowa biblioteka QR' not in medical
          assert index.count('ADMIN — UDOSTĘPNIANIE KLUBU START') == 1
          assert index.count('ADMIN — UDOSTĘPNIANIE KLUBU: CSS START') == 1
          assert "window.APP_BUILD = 'APP v3.06';" in index
          assert 'const MEDICAL_PATCH_VERSION = "3";' in sw

          scripts = re.findall(
              r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',
              index,
              flags=re.I,
          )

          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile(
                  'w', suffix='.js', encoding='utf-8', delete=False
              ) as handle:
                  handle.write(script)
                  filename = handle.name
              subprocess.run(['node', '--check', filename], check=True)

          subprocess.run(['node', '--check', 'medical-no-polling.js'], check=True)
          subprocess.run(['node', '--check', 'service-worker.js'], check=True)
          print('Walidacja scalonego frontu zakończona poprawnie.')
          PY

      - name: Commit merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORG HUB frontend cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Merge club share into admin sector [skip ci]"
          git push origin main
