name: Merge club share into index

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/merge-club-share.yml"
  status:
  check_run:
    types: [completed]

permissions:
  contents: write

concurrency:
  group: merge-club-share-into-index
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge club share into index
        shell: python
        env:
          CSS_B64: ""
          HTML_B64: ""
          JS_B64: ""
          MEDICAL_B64: ""
        run: |
          from pathlib import Path
          import base64
          import gzip
          import os
          import re

          def decode_(name):
              raw = base64.b64decode(os.environ[name])
              return gzip.decompress(raw).decode("utf-8")

          index_path = Path("index.html")
          medical_path = Path("medical-no-polling.js")
          club_path = Path("club-share.js")
          workflow_path = Path(".github/workflows/merge-club-share.yml")

          index = index_path.read_text(encoding="utf-8")
          css_block = decode_("CSS_B64")
          html_block = decode_("HTML_B64")
          js_block = decode_("JS_B64")
          medical_core = decode_("MEDICAL_B64")

          css_start = "/* ===== ADMIN — UDOSTĘPNIANIE KLUBU: CSS START ===== */"
          css_end = "/* ===== ADMIN — UDOSTĘPNIANIE KLUBU: CSS KONIEC ===== */"
          js_start = "/* =================== ADMIN — UDOSTĘPNIANIE KLUBU START =================== */"
          js_end = "/* =================== ADMIN — UDOSTĘPNIANIE KLUBU KONIEC =================== */"

          index = re.sub(
              re.escape(css_start) + r".*?" + re.escape(css_end) + r"\s*",
              "",
              index,
              flags=re.S,
          )
          index = re.sub(
              re.escape(js_start) + r".*?" + re.escape(js_end) + r"\s*",
              "",
              index,
              flags=re.S,
          )
          index = re.sub(
              r'\s*<!-- ADMIN — UDOSTĘPNIANIE KLUBU -->\s*'
              r'<section id="orgHubClubShareSection".*?</section>\s*',
              "\n",
              index,
              flags=re.S,
          )

          style_close = index.find("</style>")
          if style_close < 0:
              raise RuntimeError("Brak </style> w index.html")

          index = (
              index[:style_close]
              + "\n"
              + css_block.rstrip()
              + "\n\n  "
              + index[style_close:]
          )

          back_button = """    <button class="full-btn alt" type="button" onclick="appBack()">
      ⬅ Wróć
    </button>"""
          if index.count(back_button) != 1:
              raise RuntimeError(
                  "Nie rozpoznano przycisku powrotu w ustawieniach klubu"
              )

          index = index.replace(
              back_button,
              html_block.rstrip() + "\n\n" + back_button,
              1,
          )

          old_open = """function adminOpenClubSeasonSettingsView() {
  goToView("adminClubSeasonSettingsView");
}"""
          new_open = """function adminOpenClubSeasonSettingsView() {
  goToView("adminClubSeasonSettingsView");

  if (typeof window.adminClubShareRefresh_ === "function") {
    window.adminClubShareRefresh_();
  }
}"""

          if old_open not in index:
              raise RuntimeError(
                  "Nie rozpoznano adminOpenClubSeasonSettingsView"
              )
          index = index.replace(old_open, new_open, 1)

          sector_end = (
              "/* =================== KONIEC SEKTORA 190 a =================== */"
          )
          if index.count(sector_end) != 1:
              raise RuntimeError("Nie rozpoznano końca sektora 190 a")

          index = index.replace(
              sector_end,
              js_block.rstrip() + "\n\n" + sector_end,
              1,
          )

          if "window.APP_BUILD = 'APP v3.05';" in index:
              index = index.replace(
                  "window.APP_BUILD = 'APP v3.05';",
                  "window.APP_BUILD = 'APP v3.06';",
                  1,
              )
          elif "window.APP_BUILD = 'APP v3.06';" not in index:
              raise RuntimeError("Nie rozpoznano APP_BUILD")

          index_path.write_text(index, encoding="utf-8")
          medical_path.write_text(medical_core, encoding="utf-8")

          if club_path.exists():
              club_path.unlink()

          if workflow_path.exists():
              workflow_path.unlink()

      - name: Validate merged frontend
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          index = Path("index.html").read_text(encoding="utf-8")
          medical = Path("medical-no-polling.js").read_text(encoding="utf-8")

          assert not Path("club-share.js").exists()
          assert "club-share.js" not in medical
          assert "installAdminClubShareLoader_" not in medical
          assert "ADMIN HOTFIX: prawidłowa biblioteka QR" not in medical
          assert index.count("ADMIN — UDOSTĘPNIANIE KLUBU START") == 1
          assert index.count("ADMIN — UDOSTĘPNIANIE KLUBU: CSS START") == 1
          assert index.count('id="orgHubClubShareSection"') == 1
          assert "window.APP_BUILD = 'APP v3.06';" in index

          scripts = re.findall(
              r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',
              index,
              flags=re.I,
          )

          for number, script in enumerate(scripts, start=1):
              if not script.strip():
                  continue

              with tempfile.NamedTemporaryFile(
                  "w",
                  suffix=".js",
                  encoding="utf-8",
                  delete=False,
              ) as handle:
                  handle.write(script)
                  filename = handle.name

              subprocess.run(
                  ["node", "--check", filename],
                  check=True,
              )

          subprocess.run(
              ["node", "--check", "medical-no-polling.js"],
              check=True,
          )

          print("Walidacja scalonego frontu zakończona poprawnie.")
          PY

      - name: Commit merged structure
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ORG HUB frontend cleanup"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi

          git commit -m "Merge club share into admin sector [skip ci]"
          git push origin HEAD:main
