name: Finish recurring events frontend

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-frontend:
    if: github.event.issue.title == 'ORG HUB: finish recurring events frontend'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch recurring events frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          control_pattern = re.compile(
              r'''<input\s+id="eventRepeatDays"\s+class="event-repeat-input"\s+type="number"\s+inputmode="numeric"\s+min="1"\s+step="1"\s+autocomplete="off"\s*>'''
          )

          options = "\n".join(
              f'          <option value="{day}">{day}</option>'
              for day in range(31)
          )

          new_control = (
              '<select\n'
              '          id="eventRepeatDays"\n'
              '          class="event-repeat-input"\n'
              '          aria-label="Liczba dni pomiędzy wydarzeniami"\n'
              '        >\n'
              + options + '\n'
              '        </select>'
          )

          text, control_count = control_pattern.subn(new_control, text, count=1)
          if control_count != 1:
              raise RuntimeError(f"Nie znaleziono pola eventRepeatDays: {control_count}")

          logic_pattern = re.compile(
              r'''const repeatDaysRaw\s*=\s*String\(\s*document\.getElementById\(\s*"eventRepeatDays"\s*\)\?\.value\s*\|\|\s*""\s*\)\.trim\(\);\s*let repeatDays\s*=\s*"";\s*if\s*\(repeatDaysRaw\)\s*\{.*?repeatDays\s*=\s*repeatDaysNum;\s*\}\s*const msg\s*=\s*document\.getElementById\("eventMsg"\);''',
              re.S,
          )

          new_logic = '''const msg =
            document.getElementById("eventMsg");

          const repeatDays = Number(
            document.getElementById(
              "eventRepeatDays"
            )?.value || 0
          );

          if (
            !Number.isInteger(repeatDays) ||
            repeatDays < 0 ||
            repeatDays > 30
          ) {
            if (msg) {
              msg.textContent =
                "❌ Wybierz liczbę dni od 0 do 30.";
            }

            return;
          }'''

          text, logic_count = logic_pattern.subn(new_logic, text, count=1)
          if logic_count != 1:
              raise RuntimeError(f"Nie znaleziono logiki repeatDays: {logic_count}")

          cleanup_anchor = '''    /*
     * Czyszczenie pól obsługiwanych osobno.
     */'''

          cleanup_replacement = '''    const repeatDaysEl =
      document.getElementById(
        "eventRepeatDays"
      );

    if (repeatDaysEl) {
      repeatDaysEl.value = "0";
    }

    /*
     * Czyszczenie pól obsługiwanych osobno.
     */'''

          if text.count(cleanup_anchor) != 1:
              raise RuntimeError(
                  f"Nie znaleziono miejsca resetu formularza: {text.count(cleanup_anchor)}"
              )

          text = text.replace(cleanup_anchor, cleanup_replacement, 1)

          old_build = "window.APP_BUILD = 'APP v3.05';"
          new_build = "window.APP_BUILD = 'APP v3.06';"

          if text.count(old_build) != 1:
              raise RuntimeError(
                  f"Nie znaleziono wersji APP v3.05: {text.count(old_build)}"
              )

          text = text.replace(old_build, new_build, 1)
          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/finish-recurring-events-front.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Commit frontend changes
        run: |
          git config user.name "ORG HUB automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/finish-recurring-events-front.yml
          git commit -m "Finish recurring events frontend [skip ci]"
          git push origin main
