name: Finish recurring events frontend

on:
  push:
    paths:
      - ".github/workflows/finish-recurring-events-front.yml"

permissions:
  contents: write

jobs:
  patch-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch recurring events frontend
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_control = '''        <input
                  id="eventRepeatDays"
                  class="event-repeat-input"
                  type="number"
                  inputmode="numeric"
                  min="1"
                  step="1"
                  autocomplete="off"
                >'''

          options = "\n".join(
              f'          <option value="{day}">{day}</option>'
              for day in range(31)
          )

          new_control = f'''        <select
                  id="eventRepeatDays"
                  class="event-repeat-input"
                  aria-label="Liczba dni pomiędzy wydarzeniami"
                >
          {options}
                </select>'''

          if text.count(old_control) != 1:
              raise RuntimeError(
                  f"Nie znaleziono jednoznacznie pola eventRepeatDays: {text.count(old_control)}"
              )

          text = text.replace(old_control, new_control, 1)

          old_repeat_logic = '''const repeatDaysRaw = String(
            document.getElementById(
              "eventRepeatDays"
            )?.value || ""
          ).trim();

          let repeatDays = "";

          if (repeatDaysRaw) {
            const repeatDaysNum = Number(repeatDaysRaw);

            if (
              !Number.isInteger(repeatDaysNum) ||
              repeatDaysNum < 1
            ) {
              const msg =
                document.getElementById("eventMsg");

              if (msg) {
                msg.textContent =
                  "❌ Liczba dni powtarzania musi być liczbą całkowitą większą od zera.";
              }

              return;
            }

            repeatDays = repeatDaysNum;
          }

          const msg =
            document.getElementById("eventMsg");'''

          new_repeat_logic = '''const msg =
            document.getElementById("eventMsg");

          const repeatDays = Number(
            document.getElementById(
              "eventRepeatDays"
            )?.value || 0
          );

          if (
            !Number.isInteger(repeatDays) ||
            repeatDays < 0 ||
            repeatDays > 30
          ) {
            if (msg) {
              msg.textContent =
                "❌ Wybierz liczbę dni od 0 do 30.";
            }

            return;
          }'''

          if text.count(old_repeat_logic) != 1:
              raise RuntimeError(
                  f"Nie znaleziono jednoznacznie logiki repeatDays: {text.count(old_repeat_logic)}"
              )

          text = text.replace(old_repeat_logic, new_repeat_logic, 1)

          cleanup_anchor = '''          });

              /*
               * Czyszczenie pól obsługiwanych osobno.
               */'''

          cleanup_replacement = '''          });

              const repeatDaysEl =
                document.getElementById(
                  "eventRepeatDays"
                );

              if (repeatDaysEl) {
                repeatDaysEl.value = "0";
              }

              /*
               * Czyszczenie pól obsługiwanych osobno.
               */'''

          if text.count(cleanup_anchor) != 1:
              raise RuntimeError(
                  f"Nie znaleziono jednoznacznie miejsca resetu formularza: {text.count(cleanup_anchor)}"
              )

          text = text.replace(cleanup_anchor, cleanup_replacement, 1)

          old_build = "window.APP_BUILD = 'APP v3.05';"
          new_build = "window.APP_BUILD = 'APP v3.06';"

          if text.count(old_build) != 1:
              raise RuntimeError(
                  f"Nie znaleziono jednoznacznie wersji APP v3.05: {text.count(old_build)}"
              )

          text = text.replace(old_build, new_build, 1)
          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/finish-recurring-events-front.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Commit frontend changes
        run: |
          git config user.name "ORG HUB automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/finish-recurring-events-front.yml
          git commit -m "Finish recurring events frontend [skip ci]"
          git push
