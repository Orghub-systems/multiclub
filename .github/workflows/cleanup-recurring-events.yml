name: Cleanup recurring events frontend

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.issue.title == 'ORG HUB: cleanup recurring events frontend 20260724'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge recurring events into index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          index_path = Path("index.html")
          front_path = Path("recurring-events-front.js")
          css_path = Path("recurring-events-front.css")

          index = index_path.read_text(encoding="utf-8")
          front = front_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8").strip()

          css_start = "/* ===== ORG HUB: WYDARZENIA CYKLICZNE — START ===== */"
          css_end = "/* ===== ORG HUB: WYDARZENIA CYKLICZNE — KONIEC ===== */"
          js_start = "/* ===== ORG HUB: WYDARZENIA CYKLICZNE — START ===== */"
          js_end = "/* ===== ORG HUB: WYDARZENIA CYKLICZNE — KONIEC ===== */"

          # Usuń ewentualną wcześniejszą wersję bloku inline, aby operacja była idempotentna.
          index = re.sub(
              re.escape(css_start) + r".*?" + re.escape(css_end) + r"\s*",
              "",
              index,
              flags=re.S,
          )
          index = re.sub(
              r"<script>\s*" + re.escape(js_start) + r".*?" + re.escape(js_end) + r"\s*</script>\s*",
              "",
              index,
              flags=re.S,
          )

          # Stary styl pola input nie jest już potrzebny — wartość siedzi w hidden input,
          # a użytkownik obsługuje własne pokrętło.
          index = re.sub(
              r"\n\s*/\* Pole liczby dni \*/\s*\n"
              r"\s*#trainerDodajWydarzenieView \.event-repeat-input \{.*?\n\s*\}\s*",
              "\n",
              index,
              count=1,
              flags=re.S,
          )

          # Moduł jest teraz osadzony w index.html, więc nie ładuje zewnętrznego CSS.
          front = re.sub(
              r"\n\s*function ensureStylesheet_\(\) \{.*?\n\s*\}\n\n\s*function normalizedRepeatDays_",
              "\n\n  function normalizedRepeatDays_",
              front,
              count=1,
              flags=re.S,
          )
          front = front.replace("    ensureStylesheet_();\n", "")
          front = front.replace(
              "__orgHubRecurringEventsFrontV3",
              "__orgHubRecurringEventsFrontInlineV1",
          )

          wheel_functions = r'''  function isWheelOpen_() {
            const overlay = document.getElementById("eventRepeatWheelOverlay");
            return !!(
              overlay &&
              !overlay.classList.contains("hidden") &&
              window.getComputedStyle(overlay).display !== "none"
            );
          }

          function closeWheelFromHistory_() {
            const overlay = document.getElementById("eventRepeatWheelOverlay");
            if (!overlay || overlay.classList.contains("hidden")) return false;

            overlay.classList.add("hidden");
            overlay.setAttribute("aria-hidden", "true");
            document.body.style.overflow = previousBodyOverflow;

            if (activeWheelButton) {
              activeWheelButton.setAttribute("aria-expanded", "false");

              try {
                activeWheelButton.focus({ preventScroll: true });
              } catch (error) {
                activeWheelButton.focus();
              }
            }

            activeWheelInput = null;
            activeWheelButton = null;
            return true;
          }

          function openWheel_(input, button) {
            const overlay = ensureWheelOverlay_();
            if (isWheelOpen_()) return;

            activeWheelInput = input;
            activeWheelButton = button;

            previousBodyOverflow = document.body.style.overflow;
            document.body.style.overflow = "hidden";

            overlay.classList.remove("hidden");
            overlay.setAttribute("aria-hidden", "false");
            button.setAttribute("aria-expanded", "true");

            if (typeof pushPaymentModalHistoryState_ === "function") {
              pushPaymentModalHistoryState_("eventRepeatWheelOverlay");
            } else {
              try {
                history.pushState(
                  Object.assign({}, history.state || {}, {
                    modal: "eventRepeatWheelOverlay"
                  }),
                  "",
                  location.pathname + location.search
                );
              } catch (error) {}
            }

            const value = normalizedRepeatDays_(input.value);

            requestAnimationFrame(function() {
              scrollWheelToValue_(value, false);
              const done = overlay.querySelector("#eventRepeatWheelDone");
              if (done) done.focus({ preventScroll: true });
            });
          }

          function closeWheel_() {
            if (!isWheelOpen_()) return;

            const isWheelHistoryState = !!(
              history.state &&
              String(history.state.modal || "") === "eventRepeatWheelOverlay"
            );

            if (isWheelHistoryState) {
              try {
                history.back();
                return;
              } catch (error) {}
            }

            closeWheelFromHistory_();
          }

          window.isEventRepeatWheelOpen_ = isWheelOpen_;
          window.closeEventRepeatWheelFromHistory_ = closeWheelFromHistory_;
'''

          front, wheel_count = re.subn(
              r"  function openWheel_\(input, button\) \{.*?\n  \}\n\n"
              r"  function closeWheel_\(\) \{.*?\n  \}\n",
              wheel_functions,
              front,
              count=1,
              flags=re.S,
          )
          if wheel_count != 1:
              raise RuntimeError(f"Nie znaleziono funkcji open/close pokrętła: {wheel_count}")

          # Dopnij popup do istniejącego, centralnego listenera historii.
          popstate_anchor = '''window.addEventListener("popstate", (event) => {
            const state = event.state;
            const fallbackView = getRootViewId_();'''

          popstate_replacement = '''window.addEventListener("popstate", (event) => {
            const state = event.state;

            // Popup pokrętła korzysta z tego samego mechanizmu historii co pozostałe popupy.
            // Cofajka zamyka pokrętło i NIE przełącza widoku znajdującego się pod nim.
            if (
              typeof window.isEventRepeatWheelOpen_ === "function" &&
              window.isEventRepeatWheelOpen_() &&
              !(state && state.modal === "eventRepeatWheelOverlay")
            ) {
              if (typeof window.closeEventRepeatWheelFromHistory_ === "function") {
                window.closeEventRepeatWheelFromHistory_();
              }
              return;
            }

            const fallbackView = getRootViewId_();'''

          if index.count(popstate_anchor) != 1:
              raise RuntimeError(
                  "Nie znaleziono jednoznacznie głównego listenera popstate: "
                  + str(index.count(popstate_anchor))
              )
          index = index.replace(popstate_anchor, popstate_replacement, 1)

          # CSS trafia do istniejącego sektora <style>.
          css_block = "\n\n    " + css_start + "\n" + css + "\n    " + css_end + "\n"
          style_close = index.find("</style>")
          if style_close < 0:
              raise RuntimeError("Brak zamknięcia </style> w index.html")
          index = index[:style_close] + css_block + index[style_close:]

          # JS trafia do index.html bez tworzenia kolejnego pliku funkcjonalnego.
          inline_script = (
              "\n<script>\n"
              + js_start + "\n"
              + front.strip() + "\n"
              + js_end + "\n"
              + "</script>\n"
          )
          body_close = index.rfind("</body>")
          if body_close < 0:
              raise RuntimeError("Brak zamknięcia </body> w index.html")
          index = index[:body_close] + inline_script + index[body_close:]

          # Podbicie wersji wymusza pobranie nowego indexu i wyczyszczenie starego cache PWA.
          if "window.APP_BUILD = 'APP v3.05';" in index:
              index = index.replace(
                  "window.APP_BUILD = 'APP v3.05';",
                  "window.APP_BUILD = 'APP v3.06';",
                  1,
              )
          elif "window.APP_BUILD = 'APP v3.06';" not in index:
              raise RuntimeError("Nie rozpoznano obecnej wersji APP_BUILD")

          index_path.write_text(index, encoding="utf-8")

          # Przywróć medical-no-polling.js do wersji sprzed wykorzystania go jako loadera.
          original_medical = subprocess.check_output(
              [
                  "git",
                  "show",
                  "387c0698fda36fa98e44c1e34ff6e0b295b99e5f:medical-no-polling.js",
              ]
          )
          Path("medical-no-polling.js").write_bytes(original_medical)

          # Usuń moduły, które zostały już scalone do index.html.
          for filename in (
              "recurring-events-front.js",
              "recurring-events-front.css",
              "recurring-events-history.js",
          ):
              path = Path(filename)
              if path.exists():
                  path.unlink()

          # Jednorazowy workflow usuwa również sam siebie.
          workflow = Path(".github/workflows/cleanup-recurring-events.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)

          for index, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
                  handle.write(script)
                  temp_path = handle.name
              subprocess.run(['node', '--check', temp_path], check=True)

          subprocess.run(['node', '--check', 'medical-no-polling.js'], check=True)
          print('JavaScript validation OK')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "ORG HUB cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Merge recurring events into index and clean modules [skip ci]"
          git push origin main
