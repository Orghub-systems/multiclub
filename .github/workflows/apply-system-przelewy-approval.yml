name: Apply system-przelewy approval UI patch

on:
  push:
    branches:
      - agent/system-przelewy-approval
    paths:
      - .github/workflows/apply-system-przelewy-approval.yml

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-przelewy-approval
          fetch-depth: 0

      - name: Patch multiclub UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "window.APP_BUILD = 'APP v2.97';",
              "window.APP_BUILD = 'APP v2.98';",
              'APP_BUILD'
          )

          replace_once(
              'Przetwarzam wyciąg i księguję wpłaty...',
              'Przetwarzam wyciąg i rozpoznaję wpłaty...',
              'import progress text'
          )

          start_marker = 'function renderAdminSystemPrzelewTile_(p) {'
          end_marker = '  // minimalny escape do HTML (żeby nazwiska/rodzaje nie rozwaliły DOM)'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate renderAdminSystemPrzelewTile_ block')

          new_render = r'''function renderAdminSystemPrzelewTile_(p) {
            const status = String(p.match_status || "").trim();
            const amount = Number(p.amount || 0);

            let bg = "#111";
            let badge = `<span style="color:#ccc;font-weight:700;">${status || "—"}</span>`;

            if (status === "MATCHED_AUTO") {
              bg = "#15331d";
              badge = `<span style="color:#7dff9b;font-weight:800;">GOTOWY DO ZATWIERDZENIA</span>`;
            } else if (status === "MATCH_CANDIDATE") {
              bg = "#3a3111";
              badge = `<span style="color:#ffd36b;font-weight:700;">DO WERYFIKACJI</span>`;
            } else if (status === "MIXED_REVIEW") {
              bg = "#3a1d11";
              badge = `<span style="color:#ffb36b;font-weight:700;">PŁATNOŚĆ MIESZANA</span>`;
            } else if (status === "UNMATCHED") {
              bg = "#3a1414";
              badge = `<span style="color:#ff7c7c;font-weight:700;">NIEROZPOZNANY</span>`;
            }

            const sender = escapeHtml_(String(p.sender_name || "—"));
            const titleRaw = String(p.raw_title || "—");
            const title = escapeHtml_(titleRaw);

            const kind = String(p.suggested_payment_kind || p.matched_payment_kind || "").trim().toUpperCase();
            const period = String(p.suggested_period || p.matched_period || "").trim();
            const rowNo = Number(p.sheet_row || 0);

            const suggestedNo = String(p.suggested_player_no || "").trim();
            const suggestedNameRaw = String(p.suggested_player_name || "").trim();
            const suggestedName = escapeHtml_(suggestedNameRaw);
            const suggestedScore = Number(p.suggested_score || 0);
            const suggestedIsMixed = !!p.suggested_is_mixed;
            const suggestedParts = Array.isArray(p.suggested_parts) ? p.suggested_parts : [];

            const targetSheetRaw = String(p.target_sheet || "").trim();
            const targetSheet = escapeHtml_(targetSheetRaw);
            const targetSourceType = String(p.target_source_type || "").trim();
            const targetHeader = escapeHtml_(String(p.target_header || "").trim());
            const targetCell = escapeHtml_(String(p.target_cell || "").trim());
            const targetError = escapeHtml_(String(p.target_error || "").trim());
            const approvalReady = p.approval_ready === true;

            const titleData = encodeURIComponent(titleRaw);
            const suggestedNameData = encodeURIComponent(suggestedNameRaw);

            const suggestionHtml =
              suggestedNo
                ? `<div style="margin-top:10px; padding:8px 10px; border:1px solid #444; border-radius:10px; background:rgba(255,255,255,.04);">
                     <div style="font-size:13px; opacity:.8;">Przypisany zawodnik</div>
                     <div style="margin-top:4px; font-size:15px; font-weight:700;">#${escapeHtml_(suggestedNo)}${suggestedName ? ` — ${suggestedName}` : ""}</div>
                     <div style="margin-top:2px; font-size:12px; opacity:.75;">Pewność dopasowania: ${suggestedScore}</div>
                   </div>`
                : "";

            const accountingHtml = suggestedIsMixed
              ? `<div style="margin-top:10px; padding:8px 10px; border:1px solid #444; border-radius:10px; background:rgba(255,255,255,.04);">
                   <div style="font-size:13px; opacity:.8;">Sugestia księgowania</div>
                   <div style="margin-top:4px; font-size:15px; font-weight:700;">Płatność mieszana</div>
                   <div style="margin-top:6px; font-size:13px; opacity:.9;">
                     ${suggestedParts.map(x => {
                       const k = escapeHtml_(String(x.kind || "—"));
                       const pr = escapeHtml_(String(x.period || "—"));
                       const sh = escapeHtml_(String(x.target_sheet || "").trim());
                       const err = escapeHtml_(String(x.target_error || "").trim());
                       return `<div>• ${k} / ${pr}${sh ? ` → ${sh}` : ""}${err ? ` — ${err}` : ""}</div>`;
                     }).join("")}
                   </div>
                 </div>`
              : `<div style="margin-top:10px; padding:8px 10px; border:1px solid #444; border-radius:10px; background:rgba(255,255,255,.04);">
                   <div style="font-size:13px; opacity:.8;">Sugestia księgowania</div>
                   <div style="margin-top:4px; font-size:15px; font-weight:700;">${kind || "—"} / ${period || "—"}</div>
                 </div>`;

            const targetHtml = targetSheet
              ? `<div style="margin-top:10px; padding:9px 10px; border:1px solid ${targetSourceType === "archive" ? "#d5a52e" : "#376f42"}; border-radius:10px; background:rgba(255,255,255,.04);">
                   <div style="font-size:13px; opacity:.8;">Docelowa Kartoteka</div>
                   <div style="margin-top:4px; font-size:15px; font-weight:800; color:${targetSourceType === "archive" ? "#ffd37a" : "#8cff9f"};">${targetSheet}</div>
                   ${targetHeader ? `<div style="margin-top:3px; font-size:12px; opacity:.8;">${targetHeader}${targetCell ? ` • ${targetCell}` : ""}</div>` : ""}
                 </div>`
              : (targetError
                  ? `<div style="margin-top:10px; padding:9px 10px; border:1px solid #8b0000; border-radius:10px; background:#3a1414; color:#ff9b9b;">${targetError}</div>`
                  : "");

            let confirmBtn = "";
            let manualBtn = "";
            let splitBtn = "";

            if (
              (status === "MATCHED_AUTO" || status === "MATCH_CANDIDATE") &&
              suggestedNo && kind && period && !suggestedIsMixed && approvalReady
            ) {
              confirmBtn = `
                <button class="full-btn"
                  style="margin-top:10px; background:#0f7a2a; border-color:#19a642;"
                  onclick="adminConfirmSystemPrzelew(this, ${rowNo}, '${suggestedNo}', '${kind}', '${period}', decodeURIComponent('${suggestedNameData}'), ${amount})">
                  Zatwierdź wpłatę
                </button>
              `;
            }

            if (
              status === "MATCHED_AUTO" ||
              status === "UNMATCHED" ||
              status === "MATCH_CANDIDATE" ||
              status === "MIXED_REVIEW"
            ) {
              manualBtn = `
                <button class="full-btn alt"
                  style="margin-top:10px;"
                  onclick="adminOpenManualSystemPrzelew(${rowNo}, decodeURIComponent('${titleData}'), '${suggestedNo}', '${kind}', '${period}')">
                  Przypisz ręcznie
                </button>
              `;
            }

            if (status === "MIXED_REVIEW" && suggestedNo && suggestedParts.length) {
              splitBtn = `
                <button class="full-btn"
                  style="margin-top:10px; background:#b86a00; border-color:#ff9d00;"
                  onclick="adminSplitMixedPayment(${rowNo}, '${suggestedNo}')">
                  Zatwierdź i rozbij płatność
                </button>
              `;
            }

            const ignoreBtn = `
              <button class="full-btn alt"
                style="margin-top:10px;"
                onclick="adminIgnoreSystemPrzelew(${rowNo})">
                Ignoruj przelew
              </button>
            `;

            return `
              <div id="systemPrzelewRow_${rowNo}" class="card" style="background:${bg}; text-align:left; margin-top:10px;">
                <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
                  <div style="flex:1;">
                    <div style="opacity:.85; font-size:13px;">Wiersz: ${rowNo}</div>
                    <div style="font-size:18px; font-weight:800; margin-top:4px;">${amount} zł</div>
                    <div style="margin-top:6px; font-size:14px; opacity:.95;">${sender}</div>
                  </div>
                  <div style="text-align:right;">${badge}</div>
                </div>

                <div style="height:1px; background:#333; margin:12px 0;"></div>
                <div style="opacity:.8; font-size:13px;">Tytuł przelewu</div>
                <div style="margin-top:4px; font-size:15px; font-weight:700; word-break:break-word;">${title}</div>

                ${suggestionHtml}
                ${accountingHtml}
                ${targetHtml}
                ${confirmBtn}
                ${manualBtn}
                ${splitBtn}
                ${ignoreBtn}
              </div>
            `;
          }

          '''

          text = text[:start] + new_render + text[end:]

          replace_once(
              '        autoConfirmErrors: response.autoConfirmErrors || 0,\n        matchedAuto: response.matchedAuto || 0,',
              '        autoConfirmErrors: response.autoConfirmErrors || 0,\n        readyForApproval: response.readyForApproval || 0,\n        matchedAuto: response.matchedAuto || 0,',
              'import result payload'
          )

          old_status = '    adminUpdateSystemPrzelewyCount_(`✅ Zaksięgowałem — ${amountLabel} zł — ${kindLabel} — ${who}`);'
          new_status = '''    const targetLabel = String(res?.target_sheet || "").trim();
              adminUpdateSystemPrzelewyCount_(
                `✅ Zaksięgowano — ${amountLabel} zł — ${kindLabel} — ${who}` +
                (targetLabel ? ` — ${targetLabel}` : "")
              );'''
          replace_once(old_status, new_status, 'confirmation status')

          popup_start_marker = 'function showImportResultPopup(summary) {'
          popup_end_marker = 'function closeImportPopup() {'
          popup_start = text.find(popup_start_marker)
          popup_end = text.find(popup_end_marker, popup_start)
          if popup_start < 0 or popup_end < 0:
              raise SystemExit('Could not locate showImportResultPopup block')

          new_popup = r'''function showImportResultPopup(summary) {
            summary = summary || {};

            const added = Number(summary.added || 0);
            const duplicates = Number(summary.duplicates || 0);
            const matchedAuto = Number(summary.matchedAuto || 0);
            const matchCandidate = Number(summary.matchCandidate || 0);
            const mixedReview = Number(summary.mixedReview || 0);
            const unmatched = Number(summary.unmatched || 0);
            const readyForApproval = Number(
              summary.readyForApproval || (matchedAuto + matchCandidate)
            );

            const popup = document.getElementById("importResultPopup");
            const text = document.getElementById("importResultText");

            if (text) {
              text.style.maxHeight = "70vh";
              text.style.overflowY = "auto";
              text.style.webkitOverflowScrolling = "touch";
              text.style.paddingRight = "6px";

              text.innerHTML = `
                <div style="text-align:left; line-height:1.55;">
                  <div>Dodano przelewów: <b>${added}</b></div>
                  <div>Duplikaty: <b>${duplicates}</b></div>
                  <div style="margin-top:8px; color:#8cff9f;">Gotowe do zatwierdzenia: <b>${readyForApproval}</b></div>
                  <div>Rozpoznane po kodzie: <b>${matchedAuto}</b></div>
                  <div>Propozycje wymagające weryfikacji: <b>${matchCandidate}</b></div>
                  <div>Płatności mieszane: <b>${mixedReview}</b></div>
                  <div>Nierozpoznane: <b>${unmatched}</b></div>
                  <div style="margin-top:12px; padding:9px 10px; border:1px solid #376f42; border-radius:10px; background:#123a1a;">
                    Podczas importu nie zaksięgowano żadnej wpłaty. Każdą rozpoznaną wpłatę zatwierdza operator.
                  </div>
                </div>
              `;
            }

            if (popup) {
              popup.classList.remove("hidden");
              popup.style.display = "flex";
            }
          }

          '''

          text = text[:popup_start] + new_popup + text[popup_end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/apply-system-przelewy-approval.yml
          git config user.name "orghub-automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-system-przelewy-approval.yml
          git commit -m "Require operator approval for bank transfers"
          git push origin HEAD:agent/system-przelewy-approval
