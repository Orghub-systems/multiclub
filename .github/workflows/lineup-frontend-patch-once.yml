name: Apply lineup frontend optimization once

on:
  push:
    branches:
      - agent/supabase-lineups

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-lineups
          fetch-depth: 0

      - name: Patch index lineup flow
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return source.replace(old, new, 1)

          def regex_once(source, pattern, replacement, label):
              result, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return result

          # Player cards get lineup visibility from the normal events payload.
          text = replace_once(
              text,
              '    const toggleLabel = isPowolanie ? "👥 Powołani" : "👥 Zapisani";\n\n    return `',
              '    const toggleLabel = isPowolanie ? "👥 Powołani" : "👥 Zapisani";\n    const hasLineup = playerHasLineupFromEvent_(t);\n\n    return `',
              "player card hasLineup",
          )

          text = replace_once(
              text,
              '''          <button
            id="player-lineup-${t.id}"
            type="button"
            class="hidden"
            style="background:#1565c0;color:white;border:none;"
            onclick="playerOpenLineup_('${t.id}')">
            🏒 Zobacz lineup
          </button>''',
              '''          <button
            id="player-lineup-${t.id}"
            type="button"
            class="${hasLineup ? "" : "hidden"}"
            style="background:#1565c0;color:white;border:none;"
            onclick="playerOpenLineup_('${t.id}')">
            🏒 Zobacz lineup
          </button>''',
              "player lineup button visibility",
          )

          availability_pattern = (
              r'window\.__playerLineupAvailabilityRequestId = 0;'
              r'[\s\S]*?'
              r'function playerRefreshCurrentLineupAvailability_\(\)\s*\{'
              r'[\s\S]*?'
              r'\n\}\s*'
              r'(?=window\.__playerLineupState = null;)'
          )
          availability_replacement = '''function playerHasLineupFromEvent_(event) {
            return (
              event?.hasLineup === true ||
              event?.hasLineup === 1 ||
              String(event?.hasLineup || "")
                .trim()
                .toUpperCase() === "TRUE"
            );
          }

          /**
           * Status lineupu jest częścią zwykłej odpowiedzi wydarzeń.
           * Ta funkcja nie wykonuje żadnego dodatkowego requestu.
           */
          function playerRefreshLineupAvailability_(events) {
            (Array.isArray(events) ? events : []).forEach(function(event) {
              const eventId = String(event?.id || "").trim();
              if (!eventId) return;

              const button = document.getElementById(`player-lineup-${eventId}`);
              if (!button) return;

              button.classList.toggle(
                "hidden",
                !playerHasLineupFromEvent_(event)
              );
            });
          }

          function playerRefreshCurrentLineupAvailability_() {
            const events = Object.values(
              window.__playerEventsById || {}
            );

            return playerRefreshLineupAvailability_(events);
          }

          '''
          text = regex_once(
              text,
              availability_pattern,
              availability_replacement,
              "player availability block",
          )

          # Trainer editor keeps a server revision for optimistic locking.
          text = regex_once(
              text,
              r'(const localPlayers\s*=\s*trainerLineupNormalizePlayers_\(\s*Array\.isArray\(localDraft\?\.playersSnapshot\)\s*\?\s*localDraft\.playersSnapshot\s*:\s*\[\]\s*\);)(\s*window\.__trainerLineupState\s*=\s*\{)',
              r'''\1

          const localServerVersion = Number(
            localDraft?.serverVersion
          );
          \2''',
              "trainer local server version",
          )

          text = regex_once(
              text,
              r'(assignments:\s*trainerLineupNormalizeAssignments_\(\s*localDraft\?\.assignments\s*\),)(\s*activeSlotId:\s*"",)',
              r'''\1

            serverVersion:
              Number.isSafeInteger(localServerVersion) &&
              localServerVersion >= 0
                ? localServerVersion
                : null,
          \2''',
              "trainer state server version",
          )

          # Replace the old zapisani + lineupGet pair with one lineupGet call.
          text = regex_once(
              text,
              r'''/\*\s*\n\s*\* Pobieramy równolegle:\s*\n\s*\* 1\. aktualnych zawodników wydarzenia,\s*\n\s*\* 2\. zapisany lineup\.\s*\n\s*\*/\s*const results = await Promise\.all\(\[\s*apiClubGet\("zapisani",\s*\{\s*treningId: id\s*\}\),\s*apiClubGet\("lineupGet",\s*\{\s*treningId: id,\s*sessionToken\s*\}\)\s*\]\);\s*const playersResponse = results\[0\];\s*const lineupResponse = results\[1\];\s*if \(!Array\.isArray\(playersResponse\)\) \{\s*throw new Error\(\s*"Nieprawidłowa odpowiedź listy zawodników\."\s*\);\s*\}\s*if \(\s*!lineupResponse \|\|\s*lineupResponse\.success !== true\s*\) \{\s*throw new Error\(\s*lineupResponse\?\.error \|\|\s*"Nie udało się pobrać lineupu\."\s*\);\s*\}''',
              '''/*
             * Jedno RPC zwraca zapisany lineup i aktualnych
             * zawodników wydarzenia.
             */
            const lineupResponse = await apiClubGet(
              "lineupGet",
              {
                treningId: id,
                sessionToken
              }
            );

            if (
              !lineupResponse ||
              lineupResponse.success !== true
            ) {
              throw new Error(
                lineupResponse?.error ||
                "Nie udało się pobrać lineupu."
              );
            }

            const playersResponse = Array.isArray(
              lineupResponse.players
            )
              ? lineupResponse.players
              : null;

            if (!playersResponse) {
              throw new Error(
                "Nieprawidłowa odpowiedź listy zawodników."
              );
            }''',
              "trainer one-call lineup load",
          )

          text = regex_once(
              text,
              r'(state\.players\s*=\s*trainerLineupNormalizePlayers_\(\s*playersResponse\s*\);)(\s*state\.sport\s*=)',
              r'''\1

            const serverVersion = Number(
              lineupResponse.version
            );

            state.serverVersion =
              Number.isSafeInteger(serverVersion) &&
              serverVersion >= 0
                ? serverVersion
                : 0;
          \2''',
              "trainer loaded server version",
          )

          text = regex_once(
              text,
              r'(JSON\.stringify\(\{\s*version:\s*1,)(\s*eventId:\s*id,)',
              r'''\1
                  serverVersion: state.serverVersion,\2''',
              "trainer open local backup server version",
          )

          # Save sends the revision with the same request; no pre-read is added.
          text = regex_once(
              text,
              r'(\n\s*)(const payload = \{\s*version:\s*1,\s*eventId:\s*state\.eventId,\s*sport:\s*state\.sport,\s*assignments:\s*state\.assignments\s*\};)',
              r'''\1const expectedVersion =
            Number.isSafeInteger(Number(state.serverVersion)) &&
            Number(state.serverVersion) >= 0
              ? Number(state.serverVersion)
              : null;

          \2''',
              "trainer expected version",
          )

          text = replace_once(
              text,
              '''      lineupJson: JSON.stringify(payload),
              sessionToken
            });''',
              '''      lineupJson: JSON.stringify(payload),
              expectedVersion,
              sessionToken
            });''',
              "trainer save expectedVersion param",
          )

          text = regex_once(
              text,
              r'''(/\*\s*\n\s*\* Lokalna kopia pozostaje jako awaryjny backup\.\s*\n\s*\* Źródłem głównym jest już kalendarz GAS\.\s*\n\s*\*/\s*)(const localBackup = \{)''',
              r'''const savedServerVersion = Number(
              response.version
            );

            if (
              Number.isSafeInteger(savedServerVersion) &&
              savedServerVersion >= 0
            ) {
              state.serverVersion = savedServerVersion;
            }

            /*
             * Lokalna kopia pozostaje jako awaryjny backup.
             * Źródłem głównym jest serwer.
             */
            \2''',
              "trainer save response version",
          )

          text = regex_once(
              text,
              r'(const localBackup = \{\s*\.\.\.payload,)(\s*playersSnapshot:)',
              r'''\1
              serverVersion: state.serverVersion,\2''',
              "trainer save local backup server version",
          )

          # Hard guards for the intended request model.
          if '"lineupPlayerAvailability"' in text:
              raise SystemExit("lineupPlayerAvailability API call still present")

          editor = re.search(
              r'async function trainerOpenLineupEditor_\(eventId\)[\s\S]*?\n\}\n\nfunction trainerCloseLineupEditor_',
              text,
          )
          if not editor:
              raise SystemExit("trainer editor function not found after patch")
          if 'apiClubGet("zapisani"' in editor.group(0):
              raise SystemExit("trainer editor still performs zapisani request")
          if editor.group(0).count('apiClubGet("lineupGet"') != 1:
              raise SystemExit("trainer editor must contain exactly one lineupGet")

          save = re.search(
              r'async function trainerSaveLineupDraftLocal_\(\)[\s\S]*?\n\}\n\s*/\* --- dodawanie wydarzenia --- \*/',
              text,
          )
          if not save or 'expectedVersion' not in save.group(0):
              raise SystemExit("save function does not contain optimistic version")

          path.write_text(text, encoding="utf-8")

      - name: Validate index syntax and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for match in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>', html, flags=re.I):
              attrs = match.group(1).lower()
              if 'src=' in attrs or 'application/ld+json' in attrs or 'application/json' in attrs:
                  continue
              body = match.group(2)
              if body.strip():
                  scripts.append(body)
          if not scripts:
              raise SystemExit('No inline JavaScript blocks found')
          Path('/tmp/multiclub-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/multiclub-inline.js
          git diff --check
          git diff --stat
          git diff -- index.html

      - name: Commit final frontend changes and remove one-shot workflow
        run: |
          rm .github/workflows/lineup-frontend-patch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/lineup-frontend-patch-once.yml
          git diff --cached --quiet || git commit -m "Optimize lineup frontend data flow"
          git push origin HEAD:agent/supabase-lineups
